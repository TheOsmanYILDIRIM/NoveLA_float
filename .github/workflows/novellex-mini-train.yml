name: NovelLex Mini v0.1 - base vs trained synthetic comparison

on:
  push:
    branches:
      - experiment/novellex-mini-public-training-20261110
    paths:
      - '.github/workflows/novellex-mini-train.yml'
      - 'novellex-training/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: novellex-mini-synthetic-cpu
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GLiNER2 2.1.0 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gliner2[train]==2.1.0"

      - name: Retrieve initial trained adapter artifact without retraining
        run: |
          gh run download 42707389516 --repo TheOsmanYILDIRIM/NoveLA_float --name novellex-mini-v01-synthetic-pilot --dir novellex_output
          test -s novellex_output/checkpoints/final/adapter_model.safetensors
          test -s novellex_output/checkpoints/final/adapter_config.json

      - name: Evaluate base vs exact trained adapter on 26 synthetic holdout examples
        run: python novellex-training/compare.py --output novellex_output

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novellex-mini-v01-comparison
          retention-days: 14
          if-no-files-found: warn
          path: |
            novellex_output/comparison_report.json
            novellex_output/data_checks.json
