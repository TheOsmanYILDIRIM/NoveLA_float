name: EMA FP32 optimization matrix
on:
  push:
    paths:
      - .github/ema-optimization-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FP32 testing dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install ema-lightning==1.0.4 optimum-onnx==0.1.0 optimum==2.1.0 transformers==4.57.6 onnx==1.23.2 onnxruntime==1.31.0 onnxslim psutil numpy==2.5.3
      - name: Retrieve original independently validated Optimum FP32 models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/ema-optimum
          gh run download 38004682817 -n ema-optimum-onnx-fp32-quality-verified -D dist/ema-optimum
          test -s dist/ema-optimum/text_stage.onnx
          test -s dist/ema-optimum/sound_stage.onnx
          test -s dist/ema-optimum/decoder.onnx
      - name: Run all independent optimizations and benchmarks
        id: matrix
        shell: bash
        run: |
          mkdir -p reports/ema-optimization
          set -o pipefail
          python tools/ema_optimum/optimize_matrix.py 2>&1 | tee reports/ema-optimization/latest.log
      - name: Write result summary
        if: always()
        env:
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          mkdir -p reports/ema-optimization
          test -f reports/ema-optimization/latest.log || echo 'No benchmark log; check setup steps.' > reports/ema-optimization/latest.log
          python tools/ema_optimum/optimization_report.py
      - name: Upload all candidate models and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-fp32-optimization-matrix
          path: |
            dist/ema-fp32-matrix/
            reports/ema-optimization/
          retention-days: 30
      - name: Commit report to repository
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/ema-optimization/LATEST.md reports/ema-optimization/latest.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FP32 optimization results [skip ci]'
            git push
          fi
