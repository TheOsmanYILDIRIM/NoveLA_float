name: NovelLex ONNX JNI fix — small signed ARM64 APK
on:
  push:
    branches:
      - feature/novellex-zip-import-arm64
    paths:
      - 'features/reader/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.github/workflows/novellex-split-release.yml'
      - 'novellex/README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert trusted model manifest is small and complete
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("features/reader/src/main/assets/novellex")
          assert not (root/"model.onnx").exists()
          assert not (root/"tokenizer.json").exists()
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["model_sha256"]=="de4e847915505b8c991926ff6511b2085d36f88fa9b18d5f085828e1d2080282"
          assert manifest["tokenizer_sha256"]=="cbc8ae6037812709c9c26f2a160f8dc48b0440bcb79c8141804259ae2d6adac3"
          assert manifest["model_bytes"]==141055262
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse the existing NoveLA release signing credentials
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$KEY_STORE_PASSWORD"
          test -n "$ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY" | base64 -d > app/storeFile.jks
          printf 'storeFile=storeFile.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > custom.properties
      - name: Compile and build small signed ARM64 release without model weights
        run: |
          set -euo pipefail
          sed -i '/org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :features:reader:compileReleaseKotlin :app:assembleRelease \
            -PnovellexArm64Only -PnovellexSplitModel \
            -PlocalPropertiesFilePath=custom.properties --stacktrace
      - name: Verify APK is lightweight, signed and contains no model weights
        run: |
          set -euo pipefail
          mkdir -p release-output
          python3 - <<'PY'
          import zipfile, pathlib,hashlib,shutil
          apks=list(pathlib.Path("app/build/outputs/apk/release").glob("*.apk"))
          assert len(apks)==1,apks
          apk=apks[0]
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              libs={name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
              assert libs=={"arm64-v8a"},libs
              assert 'assets/novellex/manifest.json' in names
              assert 'assets/novellex/model.onnx' not in names
              assert 'assets/novellex/tokenizer.json' not in names
          assert apk.stat().st_size < 75_000_000, ("APK too large",apk.stat().st_size)
          path=pathlib.Path("release-output/NoveLA-NovelLex-Model-Import-arm64-v8a-release.apk")
          shutil.copyfile(apk,path)
          print("APK_SIZE_BYTES=",path.stat().st_size)
          print("APK_SHA256=",hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs release-output/*.apk
      - name: Ensure R8 did not rename ONNX Runtime classes or native JNI methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          keep=Path('app/proguard-rules.pro').read_text()
          assert '-keep class ai.onnxruntime.** { *; }' in keep
          mapping=Path('app/build/outputs/mapping/release/mapping.txt').read_text()
          inside=False
          for line in mapping.splitlines():
              if not line.startswith((' ', '\t')):
                  inside=line.startswith('ai.onnxruntime.')
                  if inside and ' -> ' in line:
                      src,dst=line.rstrip(':').split(' -> ',1)
                      assert src==dst, f'R8 renamed ONNX native class {line}'
              elif inside and ' -> ' in line and '(' in line:
                  left,right=line.rsplit(' -> ',1)
                  original=left.split('(')[0].strip().split(' ')[-1]
                  assert original==right.strip(), f'R8 renamed ONNX JNI-sensitive method {line}'
          print('R8 JNI keep verified')
          PY
      - name: Publish signed APK-only hotfix (reuse previous model ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novellex-arm64-jni-fix-${{ github.sha }}
          name: NoveLA NovelLex ONNX JNI hotfix — ARM64
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: release-output/NoveLA-NovelLex-Model-Import-arm64-v8a-release.apk
          body: |
            ARM64-only signed experimental ONNX Runtime JNI / R8 keep-rule
            hotfix. Installs as an UPDATE to the same NoveLA package.
            APK contains no GLiNER model weights. Do not uninstall NoveLA:
            installed model and glossary are preserved on same-signature updates.

            IMPORTANT: If you already imported the model ZIP, DO NOT download
            it again. If you still need it, download the one-time model ZIP:
            https://github.com/TheOsmanYILDIRIM/NoveLA_float/releases/download/novellex-model-zip-arm64-a8b419f41dfea46880d05fcd915ca75063f7194e/NovelLex_GLiner25_INT8_Model_Offline.zip

            Release build / JNI mapping checks pass, but real physical ARM64
            loading and model inference are not yet device-verified.
