name: EMA PCM Test APK
on:
  push:
    paths:
      - 'ema-test-app/**'
      - '.github/workflows/ema-pcm-test-apk.yml'
      - '.github/ema-pcm-test-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore immutable release assets and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ema-fp32-verified-20261010
          mkdir -p ema-test-app/app/src/main/assets/ema
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/ema-release
          cd /tmp/ema-release
          cat > EXPECTED <<'EOF'
          85c7a5a5946dd1257ef98237040e1cc8ded61049d9878fc1f3a89b0dac2d430a  text_stage.onnx
          65c3746cc64a17089a534ad6df5f492ace04a14c958da93f3c99c581daadbf94  sound_stage.onnx
          8a907ccbe35945030efe09d3ae886861e546882332ee8a3786167ccaa18ea42d  decoder.onnx
          95685d95b8540f7914650596f86306b975f0ca0eda74e5472bb337f0211b0261  vocab.json
          EOF
          sha256sum -c EXPECTED
          cp text_stage.onnx sound_stage.onnx decoder.onnx vocab.json "$GITHUB_WORKSPACE/ema-test-app/app/src/main/assets/ema/"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated test APK
        working-directory: ema-test-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify test package and four assets
        run: |
          set -euo pipefail
          APK=$(find ema-test-app/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep "package: name='my.novela.ematest'"
          for name in text_stage.onnx sound_stage.onnx decoder.onnx vocab.json; do
            unzip -Z1 "$APK" | grep -Fx "assets/ema/$name"
          done
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: EMA-PCM-Test-APK
          path: ema-test-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
