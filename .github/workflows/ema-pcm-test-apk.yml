name: EMA PCM Test APK
on:
  push:
    paths:
      - 'ema-test-app/**'
      - '.github/workflows/ema-pcm-test-apk.yml'
      - '.github/ema-pcm-test-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified FP32 models from previous successful Clone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/TheOsmanYILDIRIM/NoveLA_float/actions/artifacts/11665893872/zip > /tmp/verified-clone.zip
          mkdir -p /tmp/verified-clone
          unzip -q /tmp/verified-clone.zip -d /tmp/verified-clone
          APK=$(find /tmp/verified-clone -name '*.apk' -print -quit)
          test -s "$APK"
          echo "03f9d2d6a93c9ff612ed8b05326766a065e78bcd1cee60915baa52b0ebea3d3a  $APK" | sha256sum -c -
          mkdir -p ema-test-app/app/src/main/assets/ema
          for name in text_stage.onnx sound_stage.onnx decoder.onnx vocab.json; do
            unzip -p "$APK" "assets/ema/$name" > "ema-test-app/app/src/main/assets/ema/$name"
            test -s "ema-test-app/app/src/main/assets/ema/$name"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("ema-test-app/app/src/main/assets/ema")
          assert json.loads((root/"vocab.json").read_text())["stoi"]
          print("Restored 4 assets from SHA256-verified original Clone APK")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated test APK
        working-directory: ema-test-app
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify test package and four assets
        run: |
          set -euo pipefail
          APK=$(find ema-test-app/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep "package: name='my.novela.ematest'"
          for name in text_stage.onnx sound_stage.onnx decoder.onnx vocab.json; do
            unzip -Z1 "$APK" | grep -Fx "assets/ema/$name"
          done
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: EMA-PCM-Test-APK
          path: ema-test-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
