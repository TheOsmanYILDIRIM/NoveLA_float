name: EMA ONNX comparison
on:
  push:
    paths:
      - .github/ema-comparison-trigger.txt
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install ema-lightning==1.0.4 onnxruntime==1.31.0 huggingface_hub numpy==2.5.3
      - name: Retrieve validated Optimum models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/ema-optimum
          gh run download 38004682817 -n ema-optimum-onnx-fp32-quality-verified -D dist/ema-optimum
      - name: Run comparison
        run: python tools/ema_optimum/compare_versions.py
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-head-to-head-wav
          path: dist/ema-comparison/
          retention-days: 30
