name: EMA Optimum Community — full quality parity
on:
  workflow_dispatch:
  push:
    paths:
      - .github/ema-optimum-trigger.txt
permissions:
  contents: write
concurrency:
  group: ema-optimum-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ONNX Community toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu'
          python -m pip install 'ema-lightning==1.0.4' 'optimum-onnx==0.1.0' 'optimum==2.1.0' 'transformers==4.57.6' 'onnx==1.23.2' 'onnxruntime==1.31.0' 'onnxscript==0.7.2' 'numpy==2.5.3'
      - name: Export using actual Optimum OnnxConfig and verify real speech
        id: export
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ema-optimum
          python tools/ema_optimum/export.py 2>&1 | tee reports/ema-optimum/latest.log
      - name: Write persistent result summary
        if: always()
        env:
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          mkdir -p reports/ema-optimum
          test -f reports/ema-optimum/latest.log || echo 'No Python log created: setup/checkout failure.' > reports/ema-optimum/latest.log
          python tools/ema_optimum/report.py
      - name: Upload report even if export fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-optimum-report
          path: reports/ema-optimum/
          retention-days: 30
      - name: Upload verified ONNX community models
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ema-optimum-onnx-fp32-quality-verified
          path: dist/ema-optimum/
          retention-days: 30
      - name: Commit LATEST.md and latest.log to repository branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/ema-optimum/LATEST.md reports/ema-optimum/latest.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record EMA Optimum export/quality results [skip ci]'
            git push origin "HEAD:$BRANCH"
          fi
