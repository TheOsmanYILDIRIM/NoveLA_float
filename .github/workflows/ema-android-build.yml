name: NoveLA EMA offline TTS Android build
on:
  push:
    paths:
      - .github/ema-android-trigger.txt
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout NoveLA integration
        uses: actions/checkout@v4
      - name: Restore EMA FP32 bundle
        id: ema_cache
        uses: actions/cache/restore@v4
        with:
          path: ema-tools/dist/ema-selected
          key: ema-fp32-source-7a6ba1ad216b-export-2d7a1fa45857-slim-v1
      - name: Checkout pinned converter source on cache miss
        if: steps.ema_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: TheOsmanYILDIRIM/NoveLA_float
          ref: 2d7a1fa45857b3e09dbc76cf2b1b6f5bae4fde0d
          path: ema-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.ema_cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Install pinned EMA converter on cache miss
        if: steps.ema_cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install ema-lightning==1.0.4 optimum-onnx==0.1.0 optimum==2.1.0 transformers==4.57.6 onnx==1.23.2 onnxruntime==1.31.0 onnxscript==0.7.2 onnxslim psutil numpy==2.5.3
      - name: Rebuild source model only on cache miss
        if: steps.ema_cache.outputs.cache-hit != 'true'
        working-directory: ema-tools
        run: |
          python tools/ema_optimum/export.py
          python tools/ema_optimum/rebuild_selected.py
      - name: Verify and bundle selected FP32 model
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          src = Path('ema-tools/dist/ema-selected')
          dst = Path('tooling/text_to_speech/src/main/assets/ema')
          data = json.loads((src/'manifest.json').read_text())
          assert data['recipe'] == 'Optimum FP32 -> ORT Extended -> OnnxSlim'
          assert data['source_commit'] == '7a6ba1ad216bb2f1da9863f80ac8770a6a807632'
          assert data['precision'] == 'FP32'
          stages = {'text_stage', 'sound_stage', 'decoder'}
          assert set(data['models']) == stages
          dst.mkdir(parents=True, exist_ok=True)
          for stage in sorted(stages):
              file = src/(stage+'.onnx')
              meta = data['models'][stage]
              assert file.stat().st_size == meta['bytes'], stage
              assert hashlib.sha256(file.read_bytes()).hexdigest() == meta['sha256'], stage
              shutil.copyfile(file, dst/file.name)
          vocab = src/'vocab.json'
          assert json.loads(vocab.read_text())['stoi']
          shutil.copyfile(vocab, dst/vocab.name)
          PY
      - name: Save verified model for following builds
        if: steps.ema_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ema-tools/dist/ema-selected
          key: ema-fp32-source-7a6ba1ad216b-export-2d7a1fa45857-slim-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Remove machine-specific JDK setting
        run: sed -i '/org.gradle.java.home/d' gradle.properties
      - name: Build APK with embedded EMA engine
        id: compile
        shell: bash
        run: |
          mkdir -p reports/ema-android
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee reports/ema-android/build.log
      - name: Check packaged APK contains complete offline EMA model
        if: steps.compile.outcome == 'success'
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          for name in text_stage.onnx sound_stage.onnx decoder.onnx vocab.json; do
            unzip -Z1 "$APK" | grep -Fx "assets/ema/$name"
          done
      - name: Write build status for future sessions
        if: always()
        env:
          BUILD_STATUS: ${{ steps.compile.outcome }}
        run: |
          mkdir -p reports/ema-android
          printf '# NoveLA EMA Android build\n\n- Result: **%s**\n- Run: https://github.com/%s/actions/runs/%s\n- Source: pinned EMA 1.0.4 FP32 Optimum Extended -> Slim\n- Build logs: [build.log](build.log)\n- Device synthesis and Turkish normalization parity: NOT YET VERIFIED\n' "$BUILD_STATUS" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > reports/ema-android/LATEST.md
          test -f reports/ema-android/build.log || echo "Gradle did not begin" > reports/ema-android/build.log
      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novela-ema-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            reports/ema-android/
          retention-days: 7
      - name: Commit report to branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/ema-android/LATEST.md reports/ema-android/build.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record native EMA Android build [skip ci]'
            git -c rebase.autoStash=true pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
