name: EMA ONNX Community-style independent export
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ema_onnx/**
      - .github/workflows/ema-onnx.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original EMA and ONNX Community export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install 'ema-lightning==1.0.4' 'optimum-onnx' 'onnx' 'onnxscript' 'onnxruntime' 'huggingface_hub' 'numpy'
      - name: Export from original EMA model and validate with ONNX Runtime
        run: python tools/ema_onnx/export.py
      - name: Upload verified graphs and manifest
        uses: actions/upload-artifact@v4
        with:
          name: ema-lightning-independent-onnx
          path: dist/ema-onnx/
          retention-days: 30
