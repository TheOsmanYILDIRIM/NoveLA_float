name: EMA ONNX Community export validation
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ema_onnx/**
      - .github/workflows/ema-onnx.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
          python -m pip install 'ema-lightning==1.0.4' 'optimum-onnx' 'onnx' 'onnxscript' 'onnxruntime' 'huggingface_hub' 'numpy'
      - name: Export and validate (capture complete log)
        id: export
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/ema-onnx
          python tools/ema_onnx/export.py 2>&1 | tee reports/ema-onnx/latest.log
      - name: Create repository-readable result
        if: always()
        env:
          RUN_RESULT: ${{ steps.export.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/ema-onnx
          python - <<'PY'
          import os, pathlib, json, datetime
          p = pathlib.Path('reports/ema-onnx')
          status = os.environ.get('RUN_RESULT', 'unknown')
          manifest = pathlib.Path('dist/ema-onnx/manifest.json')
          details = json.loads(manifest.read_text()) if manifest.exists() else {}
          lines = [
              '# EMA ONNX latest GitHub Actions result',
              '',
              f"- Result: **{status}**",
              f"- Run: {os.environ['RUN_URL']}",
              f"- Source commit: `{os.environ['SOURCE_SHA']}`",
              f"- UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              '- Full output: [latest.log](latest.log)',
              '- Models are stored in Actions artifacts, not committed to Git.',
              '',
              '## Model checks',
          ]
          for name, stage in details.get('stages', {}).items():
              lines.append(f"- {name}: {stage.get('size_bytes', '?')} bytes; SHA256 `{stage.get('sha256', '?')}`")
          if not details:
              lines.append('- No validated model manifest produced; inspect latest.log.')
          (p/'LATEST.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Upload output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ema-onnx-run-report
          path: reports/ema-onnx/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified models
        if: steps.export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ema-lightning-independent-onnx
          path: dist/ema-onnx/
          retention-days: 30
      - name: Commit readable logs to repository
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/ema-onnx/LATEST.md reports/ema-onnx/latest.log
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record EMA ONNX workflow results [skip ci]'
            git push origin "HEAD:$BRANCH"
          fi
